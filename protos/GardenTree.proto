#VRML_SIM R2025a utf8

PROTO GardenTree [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "tree"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Pose {
        translation 0 0 0.38
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.33 0.18 0.08
              roughness 0.85
              metalness 0
            }
            geometry DEF TREE_TRUNK Cylinder {
              radius 0.12
              height 0.76
            }
          }
        ]
      }
      Pose {
        translation 0 0 1.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.04 0.28 0.07
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.72
            }
          }
        ]
      }
    ]
    boundingObject Pose {
      translation 0 0 0.38
      children [
        USE TREE_TRUNK
      ]
    }
  }
}
