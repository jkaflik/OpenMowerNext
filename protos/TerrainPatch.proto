#VRML_SIM R2025a utf8

PROTO TerrainPatch [
  field SFVec3f    translation 0 0 0.006
  field SFRotation rotation    0 0 1 0
  field SFString   name        "terrain_patch"
  field SFVec3f    size        1 1 0.012
  field SFColor    color       0.12 0.42 0.12
  field SFFloat    roughness   1
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness IS roughness
          metalness 0
        }
        geometry DEF PATCH_BOX Box {
          size IS size
        }
      }
    ]
  }
}
