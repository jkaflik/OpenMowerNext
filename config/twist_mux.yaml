twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      navigation:
        topic   : cmd_vel_nav
        timeout : 0.5
        priority: 10
      calibration:
        topic   : cmd_vel_calibration
        timeout : 0.5
        priority: 50
      joystick:
        topic   : cmd_vel_joy
        timeout : 0.5
        priority: 100
